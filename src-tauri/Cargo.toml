[package]
name = "gomman_ceylon_dockets"
version = "1.0.0"
description = "GOMMAN: The Ceylon Night Dockets — Sri Lankan Occult Folk-Horror"
authors = ["After Monsoon Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamworks = { version = "0.11", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
steam = ["dep:steamworks"]
