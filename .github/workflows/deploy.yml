# .github/workflows/deploy.yml
name: After Monsoon · Anthology CI/CD (PWA & Android APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Twine Narrative Audit, 120-Line Gatekeeper, PWA Build & Firebase
  # ============================================================================
  build-and-deploy-pwa:
    name: Validate Twine & Deploy PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Placeholder Flow Loops Exist for CI Audit
        run: |
          mkdir -p public/flow-loops public/.well-known
          for loop in bodima_rain_window pahana_steady pahana_nil_manel mirror_dark_idle kandy_mist_bamboo mohini_saree_silhouette kaduru_puddle_feet sanni_mask_torch matara_hearth_smoke wadamal_blood_hedge iron_sickle_ember peduru_funeral_mat thummansala_banyan_wind sohon_boar_silhouette iron_betel_cutter_ash dummala_vidiya_cards; do
            [ -f "public/flow-loops/${loop}.webm" ] || touch "public/flow-loops/${loop}.webm"
          done

      - name: Enforce .antigravity 120-Line Ceiling on src/
        run: |
          VIOLATIONS=0
          while IFS= read -r file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 120 ]; then
              echo "::error file=$file::Architectural violation: $file has $LINES lines (limit is 120)."
              VIOLATIONS=1
            fi
          done < <(find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.css" \) ! -name "compiledStory.json")
          if [ "$VIOLATIONS" -ne 0 ]; then
            exit 1
          fi
          echo "All src/ modules passed the 120-line ceiling check."

      - name: Compile & Validate Twine Anthology (.twee -> JSON)
        run: npm run sync-story

      - name: Run Vitest Core Engine Suite (bulathCodec & twineParser)
        run: npm test

      - name: Inject Android SHA-256 Fingerprint into assetlinks.json
        if: env.ASSETLINKS_SHA256 != ''
        env:
          ASSETLINKS_SHA256: ${{ secrets.ASSETLINKS_SHA256 }}
        run: |
          cat <<EOF > public/.well-known/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.aftermonsoon.kalukumara",
                "sha256_cert_fingerprints": ["${ASSETLINKS_SHA256}"]
              }
            }
          ]
          EOF

      - name: TypeScript Audit & Vite PWA Production Build
        run: npm run build

      - name: Upload Compiled Web Dist Artifact for Android Job
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web-dist
          path: |
            dist/
            src/core/compiledStory.json
          retention-days: 7

      - name: Deploy Preview Channel to Firebase Hosting (Pull Requests)
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: after-monsoon-kalu-kumara

      - name: Deploy Live Production to Firebase Hosting (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: after-monsoon-kalu-kumara

  # ============================================================================
  # JOB 2: Capacitor Android Sync & Native APK Assembly
  # ============================================================================
  assemble-android-apk:
    name: Build & Test Capacitor Android APK
    needs: build-and-deploy-pwa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Required for Capacitor 7 / AGP 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Download Compiled Web Dist & Story Graph
        uses: actions/download-artifact@v4
        with:
          name: pwa-web-dist
          path: .

      - name: Initialize or Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Native Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalu-kumara-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # JOB 3: Signed Android Release APK (Triggered by git push origin v*)
  # ============================================================================
  release-signed-apk:
    name: Sign & Release Android APK
    needs: assemble-android-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Download Compiled Web Dist & Story Graph
        uses: actions/download-artifact@v4
        with:
          name: pwa-web-dist
          path: .

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Decode Android Keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.keystore
          fi

      - name: Assemble Signed Release APK via Gradle
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release-key.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon --stacktrace

          # Align and verify APK signature
          ./gradlew alignRelease --no-daemon || true

      - name: Create GitHub Release & Upload Signed APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Kalu Kumara · Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
